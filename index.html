<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBA Login Generator</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 20px auto;
    padding: 20px;
    background: #f5f5f5;
}

.container {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
}

h1 {
    margin: 0;
    color: #333;
}

p {
    color: #666;
    margin-bottom: 20px;
}

.header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
}

.header img {
    width: 50px;
    height: auto;
}

label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color: #333;
}

textarea {
    width: 100%;
    padding: 10px;
    box-sizing: border-box;
    margin-bottom: 15px;
    font-family: Arial, sans-serif;
    border: 1px solid #ccc;
    border-radius: 6px;
}

textarea:focus {
    outline: none;
    border-color: #6CC14C;
    box-shadow: 0 0 5px rgba(108, 193, 76, .4);
}

button {
    background: #6CC14C;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: background-color 0.2s ease;
}

button:hover {
    background: #5aae3f;
}

button:active {
    background: #4e9f37;
}

#output {
    margin-top: 20px;
    font-family: Consolas, monospace;
    white-space: pre;
    min-height: 500px;
}
</style>

</head>
<body>

<div class="container">

<h1>RBA Login Generator</h1>
<p>Enter employee logins for each location. List should be comma deliminated</p><img src = "https://cdn3.emoji.gg/emojis/2071-cat-thumbs-up.png" style="width: 50px; height: auto;">

<label><strong>Milwaukee Users</strong></label>
<textarea
    id="milwaukee"
    rows="4"
    placeholder="Ex. JoJo Mejias"></textarea>

<label><strong>Greater Wisconsin Users</strong></label>
<textarea
    id="gwi"
    rows="4"
    placeholder="Ex. Sara Soroko, Ryu Yang"></textarea>

<button onclick="generate()">Generate Logins</button>

<textarea
    id="output"
    rows="25"
    readonly
    placeholder="Generated credentials will appear here..."></textarea>

</div>

<script>

function generatePassword() {
    const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const lower = "abcdefghijklmnopqrstuvwxyz";
    const numbers = "0123456789";

    let password =
        upper[Math.floor(Math.random() * upper.length)] +
        lower[Math.floor(Math.random() * lower.length)] +
        lower[Math.floor(Math.random() * lower.length)];

    for (let i = 0; i < 5; i++) {
        password += numbers[Math.floor(Math.random() * numbers.length)];
    }

    return password;
}

function processUsers(userList, domain, sectionTitle) {

    const users = userList
        .split(",")
        .map(name => name.trim())
        .filter(name => name.length > 0);

    if (users.length === 0) {
        return "";
    }

    let result =

`============================================================
${sectionTitle}
============================================================

`;

    users.forEach(name => {

        const parts = name.trim().split(/\s+/);

        if (parts.length < 2) return;

        const firstName = parts[0];

        // Removes spaces, hyphens, apostrophes, etc.
        const lastName = parts
            .slice(1)
            .join("")
            .replace(/[^a-zA-Z]/g, "");

        const password = generatePassword();

        result +=
`Here are the logins for ${firstName} ${lastName}:

O365:
Username: ${firstName}${lastName[0]}${domain}
Temp Password: ${password}

Enabled+:
Username: ${firstName}${lastName}
Password: ${password}!

------------------------------------------------------------

`;

    });

    result += "\n";

    return result;
}

function generate() {

    const milwaukeeUsers =
        document.getElementById("milwaukee").value;

    const gwiUsers =
        document.getElementById("gwi").value;

    let output = "";

    output += processUsers(
        milwaukeeUsers,
        "@rbamilwaukee.com",
        "MILWAUKEE USERS"
    );

    output += processUsers(
        gwiUsers,
        "@teamrba.com",
        "GREATER WISCONSIN USERS"
    );

    document.getElementById("output").value = output;
}

</script>

</body>
</html>
